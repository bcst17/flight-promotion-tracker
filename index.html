<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虎航促銷預測系統</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="虎航預測">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Flatpickr (日期多選套件) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #F9FAFB; 
            color: #1F2937;
        }

        /* 自定義滾動條：極簡細緻 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

        /* 日式極簡柔和陰影 */
        .minimal-shadow { box-shadow: 0 4px 24px -6px rgba(0, 0, 0, 0.04); }
        
        /* 無法出國標記 */
        .nogo-pattern {
            background-color: #FEF2F2;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(239, 68, 68, 0.05) 4px, rgba(239, 68, 68, 0.05) 8px);
            border-color: #FCA5A5 !important;
        }

        /* 歷史日期欄位外觀修正 */
        .custom-date-input { height: auto; padding: 0.5rem; }

        /* 清除 select 預設外觀 */
        select.custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239CA3AF' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20 md:pb-0">

    <!-- 成功儲存的中央動畫彈出窗 -->
    <div id="success-modal" class="fixed inset-0 z-[110] flex items-center justify-center pointer-events-none transition-all duration-300 opacity-0 scale-95">
        <div class="bg-gray-900/95 backdrop-blur-md text-white rounded-2xl px-8 py-6 flex flex-col items-center gap-3 shadow-2xl">
            <div class="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center text-white text-3xl shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                <i class="fa-solid fa-check"></i>
            </div>
            <span class="font-bold text-sm tracking-wider" id="success-modal-text">儲存成功</span>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="confirm-modal" class="fixed inset-0 bg-gray-900/20 backdrop-blur-sm z-[100] flex items-center justify-center hidden transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 max-w-sm w-full p-6 space-y-5 mx-4 minimal-shadow">
            <h3 class="text-sm font-bold text-gray-800 tracking-wider flex items-center gap-2" id="confirm-title">
                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 確認執行
            </h3>
            <p class="text-xs text-gray-500 leading-relaxed" id="confirm-message">確定要執行這項操作嗎？</p>
            <div class="flex justify-end gap-2 text-xs font-semibold pt-2">
                <button id="confirm-cancel" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition duration-200">取消</button>
                <button id="confirm-ok" class="px-4 py-2.5 bg-gray-900 hover:bg-black text-white rounded-xl transition duration-200 shadow-sm">確認執行</button>
            </div>
        </div>
    </div>

    <!-- 頂部導航欄 (淺色系) -->
    <header class="bg-white text-gray-800 shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center text-gray-800 shadow-sm">
                        <i class="fa-solid fa-plane-departure text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-xs sm:text-sm font-bold tracking-wider text-gray-800">虎航促銷預測系統</h1>
                    </div>
                </div>
                
                <div class="hidden md:flex space-x-1">
                    <button id="nav-dashboard" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 text-gray-900 transition duration-200">
                        <i class="fa-solid fa-calendar-days mr-1.5 text-gray-500"></i> 觀測月曆
                    </button>
                    <button id="nav-records" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition duration-200">
                        <i class="fa-solid fa-list mr-1.5 opacity-70"></i> 促銷紀錄
                    </button>
                    <button id="nav-schedules" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition duration-200">
                        <i class="fa-solid fa-clock mr-1.5 opacity-70"></i> 排班設定
                    </button>
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="btn-toggle-firebase" class="text-[10px] bg-white hover:bg-gray-50 text-gray-600 px-2.5 py-1.5 rounded-lg transition duration-200 flex items-center gap-1.5 border border-gray-200 shadow-sm font-medium">
                        <i class="fa-solid fa-cloud text-gray-400"></i>
                        <span id="firebase-status-text">同步讀取中</span>
                        <span class="inline-block w-2 h-2 rounded-full bg-gray-300" id="firebase-indicator"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="firebase-config-panel" class="bg-gray-50 border-b border-gray-200 px-4 py-5 hidden transition-all duration-300">
        <div class="max-w-7xl mx-auto space-y-4">
            <!-- Firebase Config UI Omitted for brevity, fully functional -->
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold text-gray-800 flex items-center gap-1.5"><i class="fa-solid fa-gears text-gray-400"></i> Firebase 設定</h3>
                <button id="btn-close-firebase" class="text-xs text-gray-500 hover:text-gray-800 font-medium bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">收合</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
                <div class="md:col-span-2"><input type="text" id="fb-apiKey" placeholder="apiKey" class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800"></div>
                <div><input type="text" id="fb-authDomain" placeholder="authDomain" class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800"></div>
                <div><input type="text" id="fb-projectId" placeholder="projectId" class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800"></div>
                <div class="md:col-span-2 flex gap-2">
                    <input type="text" id="fb-appId" placeholder="appId" class="flex-grow bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800">
                    <button id="btn-save-firebase" class="bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm shrink-0">連線</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 行動裝置底欄導航 -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 grid grid-cols-3 text-center py-2 z-50 text-[10px] shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
        <button id="mob-dashboard" class="mob-tab-btn text-gray-900 font-bold flex flex-col items-center">
            <i class="fa-solid fa-calendar-days text-base mb-1"></i><span>觀測月曆</span>
        </button>
        <button id="mob-records" class="mob-tab-btn text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-list text-base mb-1"></i><span>促銷紀錄</span>
        </button>
        <button id="mob-schedules" class="mob-tab-btn text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-clock text-base mb-1"></i><span>排班設定</span>
        </button>
    </div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 mb-16 md:mb-8">

        <!-- 觀測月曆 TAB -->
        <div id="tab-dashboard" class="tab-content block space-y-6">
            <div class="bg-white rounded-2xl p-5 border border-gray-100 minimal-shadow">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-route mr-1 text-gray-400"></i> 選擇航點</label>
                        <select id="calendar-route-select" class="custom-select w-full bg-gray-50 border border-gray-200 text-gray-800 font-medium rounded-xl px-3 py-2.5 text-xs outline-none transition-colors"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-filter mr-1 text-gray-400"></i> 促銷類型篩選</label>
                        <div class="space-y-3">
                            <select id="calendar-type-select" class="custom-select w-full bg-gray-50 border border-gray-200 text-gray-800 font-medium rounded-xl px-3 py-2.5 text-xs outline-none transition-colors">
                                <option value="all" selected>全部紀錄 (包含自查)</option>
                                <option value="anniversary">九月 週年促銷</option>
                                <option value="easter">三月 復活節促銷</option>
                            </select>
                            <label class="flex items-center gap-2 cursor-pointer pl-1 group w-fit">
                                <input type="checkbox" id="calendar-hide-spot" class="accent-gray-800 rounded border-gray-300 w-3.5 h-3.5 transition">
                                <span class="text-[11px] font-medium text-gray-500 group-hover:text-gray-800 transition">暫時隱藏「官網最低價」紀錄</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <!-- 左側：班表與圖例 (手機版可摺疊) -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 lg:col-span-1 minimal-shadow h-fit">
                    <div class="flex items-center justify-between cursor-pointer md:cursor-default" id="toggle-info-panel">
                        <h3 class="text-xs font-bold text-gray-800 flex items-center gap-1.5"><i class="fa-solid fa-circle-info text-gray-400"></i> 當前航線營運日 & 圖例</h3>
                        <i class="fa-solid fa-chevron-down text-gray-400 md:hidden" id="info-panel-icon"></i>
                    </div>
                    
                    <div id="info-panel-content" class="hidden md:block mt-4 space-y-5">
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px]" id="route-days-preview"></div>
                        </div>
                        <div class="bg-white rounded-xl p-3 border border-gray-100 text-[10px] space-y-3 shadow-sm">
                            <h4 class="font-bold text-gray-700 flex items-center gap-1.5 pb-2 border-b border-gray-50"><i class="fa-solid fa-tags text-gray-400"></i> 一般促銷 (PTT/檔期)</h4>
                            <div class="space-y-2.5 font-medium text-gray-600">
                                <div class="flex items-center gap-2"><span class="w-6 text-center text-orange-500 font-extrabold text-sm">→</span><span>去程預估日</span></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center text-yellow-500 font-extrabold text-sm">←</span><span>回程預估日</span></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-500 font-extrabold text-sm">⇆</span><span class="font-bold text-gray-800">雙向預估日</span></div>
                            </div>
                            
                            <h4 class="font-bold text-gray-700 flex items-center gap-1.5 pb-2 pt-2 border-t border-gray-50"><i class="fa-solid fa-desktop text-gray-400"></i> 官網最低價</h4>
                            <div class="space-y-2.5 font-medium text-gray-600">
                                <div class="flex items-center gap-2"><span class="w-6 text-center text-indigo-500 font-extrabold text-sm">→</span><span>官網自查 去程</span></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center text-purple-500 font-extrabold text-sm">←</span><span>官網自查 回程</span></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 font-extrabold text-sm">⇆</span><span class="font-bold text-gray-800">官網自查 雙向</span></div>
                            </div>

                            <div class="flex items-center gap-2 border-t border-gray-100 pt-2.5">
                                <span class="w-6 h-3 rounded nogo-pattern inline-block border"></span><span class="text-rose-500 font-bold">無法出國日期</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右側：月曆主體 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 lg:col-span-3 flex flex-col space-y-4 minimal-shadow">
                    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
                        <div class="flex items-center space-x-2">
                            <button id="btn-prev-month" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500 hover:text-gray-900 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                            <span class="text-xs font-bold text-gray-800 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200" id="calendar-range-label">讀取中...</span>
                            <button id="btn-next-month" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500 hover:text-gray-900 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="dual-calendars-container"></div>
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 hidden shadow-sm transition-all" id="calendar-day-detail">
                        <div class="flex items-start justify-between">
                            <h4 class="font-bold text-xs text-gray-800 flex items-center gap-1.5 mb-2"><i class="fa-solid fa-circle-question text-gray-400"></i> 預估詳情</h4>
                        </div>
                        <div id="calendar-day-detail-content" class="text-xs text-gray-600 leading-relaxed"></div>
                        <div class="mt-3 pt-3 border-t border-gray-200 flex justify-end" id="nogo-action-area"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 促銷紀錄 TAB -->
        <div id="tab-records" class="tab-content hidden space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- 左側：新增/編輯表單 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 space-y-5 minimal-shadow h-fit">
                    <h3 class="text-xs font-bold text-gray-800 border-b border-gray-100 pb-3 flex items-center gap-1.5" id="form-title-text">
                        <i class="fa-solid fa-plus text-gray-400"></i> 新增促銷 / 查價紀錄
                    </h3>
                    
                    <form id="record-form" class="space-y-5 text-xs">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-2 tracking-wider">紀錄來源性質</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                    <input type="radio" name="source_type" value="PTT" checked class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">PTT回報 (單日)</span>
                                </label>
                                <label class="flex items-center justify-center p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                    <input type="radio" name="source_type" value="Spot" class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">官網最低價 (可多選)</span>
                                </label>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="border-l-2 border-orange-400 pl-3 space-y-3 bg-orange-50/30 p-2 rounded-r-xl transition-colors" id="form-depart-zone">
                                <span class="text-[10px] font-bold text-gray-800 tracking-wider">去程航班 (選填)</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <select id="record-depart-from" class="custom-select w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none transition text-[10px]"></select>
                                    </div>
                                    <div>
                                        <select id="record-depart-to" class="custom-select w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none transition text-[10px]"></select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <input type="text" id="record-depart-date" placeholder="選擇歷史日期" class="custom-date-input w-full bg-white border border-gray-200 rounded-lg font-medium outline-none text-gray-800 text-[10px]">
                                    </div>
                                    <div>
                                        <input type="number" id="record-depart-price" inputmode="numeric" placeholder="未稅價如: 1599" class="w-full bg-white border border-gray-200 rounded-lg p-2 outline-none text-gray-800 text-[10px]">
                                    </div>
                                </div>
                            </div>

                            <div class="border-l-2 border-yellow-400 pl-3 space-y-3 bg-yellow-50/30 p-2 rounded-r-xl transition-colors" id="form-return-zone">
                                <span class="text-[10px] font-bold text-gray-800 tracking-wider">回程航班 (選填)</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <select id="record-return-from" class="custom-select w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none transition text-[10px]"></select>
                                    </div>
                                    <div>
                                        <select id="record-return-to" class="custom-select w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none transition text-[10px]"></select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <input type="text" id="record-return-date" placeholder="選擇歷史日期" class="custom-date-input w-full bg-white border border-gray-200 rounded-lg font-medium outline-none text-gray-800 text-[10px]">
                                    </div>
                                    <div>
                                        <input type="number" id="record-return-price" inputmode="numeric" placeholder="未稅價如: 1899" class="w-full bg-white border border-gray-200 rounded-lg p-2 outline-none text-gray-800 text-[10px]">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="promo-category-container" class="pt-1">
                            <label class="block text-[10px] font-bold text-gray-500 mb-2 tracking-wider">促銷檔期分類</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center p-2 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100">
                                    <input type="radio" name="promo_category" value="easter" checked class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">復活節促銷</span>
                                </label>
                                <label class="flex items-center justify-center p-2 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100">
                                    <input type="radio" name="promo_category" value="anniversary" class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">週年促銷</span>
                                </label>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2 pt-2">
                            <button type="submit" id="btn-submit-record" class="w-full bg-gray-900 hover:bg-black text-white font-bold p-3 rounded-xl shadow-sm transition duration-200 flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-floppy-disk"></i> <span id="btn-submit-record-text">儲存紀錄</span>
                            </button>
                            <button type="button" id="btn-cancel-edit-record" class="w-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-bold p-3 rounded-xl shadow-sm transition hidden">取消修改</button>
                        </div>
                    </form>
                </div>

                <!-- 右側歷史列表 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 lg:col-span-2 space-y-4 minimal-shadow">
                    
                    <!-- 單列工具列 (手機版不換行) -->
                    <div class="flex flex-nowrap items-center gap-2 pb-4 border-b border-gray-100 w-full">
                        <select id="record-group-mode" class="custom-select bg-gray-50 border border-gray-200 text-gray-700 text-[10px] font-bold rounded-xl pl-2 pr-6 py-2.5 shrink-0 outline-none hover:border-gray-300">
                            <option value="city">目的地</option>
                            <option value="category">檔期</option>
                            <option value="none">所有紀錄</option>
                        </select>

        // 核心對齊演算法
        function getAlignedDate(originalDateStr, targetYear) {
            const orig = new Date(originalDateStr);
            if (isNaN(orig)) return null;
            function getFirstWeekStartMonday(year, month) {
                const firstDay = new Date(year, month, 1);
                const wd = firstDay.getDay(); 
                return wd === 0 ? new Date(year, month, 2) : new Date(year, month, 1 - (wd - 1));
            }
            const origStartMonday = getFirstWeekStartMonday(orig.getFullYear(), orig.getMonth());
            const diffDays = Math.floor((orig.getTime() - origStartMonday.getTime()) / 86400000);
            const targetStartMonday = getFirstWeekStartMonday(targetYear, orig.getMonth());
            const projectedDate = new Date(targetStartMonday.getTime());
            projectedDate.setDate(projectedDate.getDate() + (Math.floor(diffDays / 7) * 7) + (diffDays % 7));
            return projectedDate;
        }

        // 解析出單筆紀錄的去回對齊日期 (包含天數推算邏輯)
        function getRecordAlignedDates(r, targetYear) {
            let alignedDepart = null;
            let alignedReturn = null;
            if (r.depart_date) alignedDepart = getAlignedDate(r.depart_date, targetYear);
            if (r.return_date) {
                if (r.depart_date && alignedDepart) {
                    const diffDays = Math.round((new Date(r.return_date).getTime() - new Date(r.depart_date).getTime()) / 86400000);
                    alignedReturn = new Date(alignedDepart.getTime());
                    alignedReturn.setDate(alignedReturn.getDate() + diffDays);
                } else {
                    alignedReturn = getAlignedDate(r.return_date, targetYear);
                }
            }
            return { alignedDepart, alignedReturn };
        }

            const activeMobNav = document.getElementById(`mob-${tabId}`); if (activeMobNav) activeMobNav.className = "mob-tab-btn text-gray-900 font-bold flex flex-col items-center";

        }

        function getUniqueDestinations() {
            const dests = new Set();
            schedules.forEach(s => { const parts = s.route.split('-'); if (parts.length === 2) { if (parts[0]!=='TPE') dests.add(parts[0]); if (parts[1]!=='TPE') dests.add(parts[1]); } });
            records.forEach(r => { ['depart_to', 'depart_from', 'return_to', 'return_from'].forEach(k => { if(r[k] && r[k]!=='TPE') dests.add(r[k]); }); });
            return Array.from(dests);
        }

        function populateRouteDropdowns() {
            const calendarRouteSelect = document.getElementById('calendar-route-select');
            if (calendarRouteSelect) {
                calendarRouteSelect.innerHTML = `<option value="all" class="font-bold">全部地區</option>`;
                const definedAirports = new Set();
                for (const [key, region] of Object.entries(regions)) {
                    calendarRouteSelect.innerHTML += `<option value="region_${key}" class="font-bold bg-gray-100">■ ${region.name}</option>`;
                    region.airports.forEach(code => { definedAirports.add(code); calendarRouteSelect.innerHTML += `<option value="${code}">　${getAirportName(code)} (${code})</option>`; });
                }
                const otherAirports = getUniqueDestinations().filter(code => !definedAirports.has(code));
                if (otherAirports.length > 0) {
                    calendarRouteSelect.innerHTML += `<option value="region_others" class="font-bold bg-gray-100">■ 其他地區</option>`;
                    otherAirports.forEach(code => calendarRouteSelect.innerHTML += `<option value="${code}">　${getAirportName(code)} (${code})</option>`);
                }
            }
            ['record-depart-from', 'record-depart-to', 'record-return-from', 'record-return-to'].forEach(id => {
                const selectEl = document.getElementById(id);
                if (!selectEl) return;
                selectEl.innerHTML = `<option value="">請選擇...</option><option disabled class="font-bold bg-gray-100">■ 台灣</option><option value="TPE">　台北桃園 (TPE)</option>`;
                for (const [key, region] of Object.entries(regions)) {
                    selectEl.innerHTML += `<option disabled class="font-bold bg-gray-100">■ ${region.name}</option>`;
                    region.airports.forEach(code => selectEl.innerHTML += `<option value="${code}">　${getAirportName(code)} (${code})</option>`);
                }
            });

        function changeMonth(dir) { currentMonth += dir; if (currentMonth < 0) { currentMonth = 11; currentYear--; } else if (currentMonth > 11) { currentMonth = 0; currentYear++; } updateDashboard(); }
        function updateDashboard() { renderRouteDaysPreview(); renderDualCalendars(); }

        function isAirportFlightDay(airportCode, weekday) {
            const sched = schedules.find(s => s.route.includes(airportCode)); return sched ? sched.days.includes(weekday) : true;
        }

        function getSelectedRouteDays() {
            const val = document.getElementById('calendar-route-select')?.value || "all";
            const days = new Set();
            if (val === 'all') { schedules.forEach(s => s.days.forEach(d => days.add(d))); return Array.from(days); }
            if (val.startsWith('region_')) {
                const rid = val.replace('region_', '');
                if (rid === 'others') {
                    const defined = new Set(); Object.values(regions).forEach(r => r.airports.forEach(a => defined.add(a)));
                    const otherDests = getUniqueDestinations().filter(c => !defined.has(c));
                    schedules.forEach(s => { if (otherDests.includes(getDestinationFromRoute(s.route))) s.days.forEach(d => days.add(d)); });
                } else {
                    const rAirports = regions[rid]?.airports || [];
                    schedules.forEach(s => { if (rAirports.includes(getDestinationFromRoute(s.route))) s.days.forEach(d => days.add(d)); });
                }
                return Array.from(days);
            }
            const sched = schedules.find(s => s.route.includes(val)); return sched ? sched.days : [0, 1, 2, 3, 4, 5, 6]; 
        }

        function isRouteMatchingSelected(r, val) {
            if (val === 'all') return true;
            if (val.startsWith('region_')) {
                const rid = val.replace('region_', '');
                if (rid === 'others') {
                    const defined = new Set(); Object.values(regions).forEach(r => r.airports.forEach(a => defined.add(a)));
                    const otherDests = getUniqueDestinations().filter(c => !defined.has(c));
                    return otherDests.includes(r.depart_to) || otherDests.includes(r.depart_from) || otherDests.includes(r.return_to) || otherDests.includes(r.return_from);
                }
                const rAirports = regions[rid]?.airports || [];
                return rAirports.includes(r.depart_to) || rAirports.includes(r.depart_from) || rAirports.includes(r.return_to) || rAirports.includes(r.return_from);
            }
            return r.depart_to === val || r.depart_from === val || r.return_to === val || r.return_from === val;
        }

        function renderRouteDaysPreview() {
            const activeDays = getSelectedRouteDays(); const container = document.getElementById('route-days-preview'); container.innerHTML = "";
            [1, 2, 3, 4, 5, 6, 0].forEach(dayIndex => {
                const isActive = activeDays.includes(dayIndex);
                container.innerHTML += `<div class="p-1 rounded text-[10px] font-bold ${isActive ? 'bg-gray-800 text-white shadow-sm' : 'bg-white border text-gray-400 line-through'}">${weekDaysChinese[dayIndex]}</div>`;
            });
        }

        function renderDualCalendars() {
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            let m1_y = currentYear, m1_m = currentMonth, m2_y = m1_m === 11 ? m1_y + 1 : m1_y, m2_m = (m1_m + 1) % 12;
            document.getElementById('calendar-range-label').textContent = `${m1_y}年 ${monthNames[m1_m]} - ${m2_y}年 ${monthNames[m2_m]}`;
            const container = document.getElementById('dual-calendars-container'); container.innerHTML = "";
            container.appendChild(buildMonthDOM(m1_y, m1_m)); container.appendChild(buildMonthDOM(m2_y, m2_m));
        }

        function buildMonthDOM(year, month) {
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            const wrapper = document.createElement('div'); wrapper.className = "space-y-2";
            wrapper.innerHTML = `<div class="text-[11px] font-bold text-gray-800 bg-gray-50 py-2 px-3 rounded-xl border border-gray-200"><span>${year}年 ${monthNames[month]}</span></div>
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-[9px] text-gray-400 pb-1"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>`;
            const daysGrid = document.createElement('div'); daysGrid.className = "grid grid-cols-7 gap-1.5 text-xs";

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startWeekday = new Date(year, month, 1).getDay(); let emptyCellsCount = startWeekday === 0 ? 6 : startWeekday - 1;
            for (let i = 0; i < emptyCellsCount; i++) daysGrid.innerHTML += `<div class="bg-gray-50/50 rounded-xl h-12 border border-transparent"></div>`;

            const routeDays = getSelectedRouteDays();
            const filterType = document.getElementById('calendar-type-select').value;
            const hideSpot = document.getElementById('calendar-hide-spot')?.checked;
            const selectedValue = document.getElementById('calendar-route-select')?.value || "all";

            for (let day = 1; day <= daysInMonth; day++) {
                const tempDate = new Date(year, month, day); const dateStr = formatDate(tempDate); const wd = tempDate.getDay();
                const isFlightDay = routeDays.includes(wd); const isNogo = nogoDays.includes(dateStr); 

                let isAlignedDepart = false, isAlignedReturn = false; 
                let isDepartFlightDay = false, isReturnFlightDay = false;
                let hasPTTDepart = false, hasSpotDepart = false, hasPTTReturn = false, hasSpotReturn = false;

                records.forEach(r => {
                    if (hideSpot && r.source_type === 'Spot') return;
                    if (filterType !== 'all') { if (r.source_type === 'Spot') return; if (r.promo_category !== filterType) return; }
                    if (!isRouteMatchingSelected(r, selectedValue)) return;

                    const { alignedDepart, alignedReturn } = getRecordAlignedDates(r, year);

                    if (alignedDepart && formatDate(alignedDepart) === dateStr) {
                        isAlignedDepart = true; if (r.source_type === 'Spot') hasSpotDepart = true; else hasPTTDepart = true;
                        if (isAirportFlightDay(r.depart_to || r.depart_from, wd)) isDepartFlightDay = true;
                    }
                    if (alignedReturn && formatDate(alignedReturn) === dateStr) {
                        isAlignedReturn = true; if (r.source_type === 'Spot') hasSpotReturn = true; else hasPTTReturn = true;
                        if (isAirportFlightDay(r.return_to || r.return_from, wd)) isReturnFlightDay = true;
                    }
                });

                let onlySpotDepart = hasSpotDepart && !hasPTTDepart, onlySpotReturn = hasSpotReturn && !hasPTTReturn;
                let bgClass = "bg-white text-gray-800 border-gray-100 hover:bg-gray-50 hover:border-gray-200", arrowIndicator = "";

                if (isNogo) { bgClass = "nogo-pattern text-rose-500 shadow-none"; } 
                else if (isAlignedDepart && isAlignedReturn) {
                    if (onlySpotDepart && onlySpotReturn) {
                        arrowIndicator = '<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 font-extrabold text-xs">⇆</span>';
                        bgClass = (isDepartFlightDay && isReturnFlightDay) ? "bg-gradient-to-r from-indigo-50 to-purple-50 border-indigo-200 font-bold" : "bg-gray-50 text-gray-400 border-gray-200 line-through";
                    } else {
                        arrowIndicator = '<span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-500 font-extrabold text-xs">⇆</span>';
                        bgClass = (isDepartFlightDay && isReturnFlightDay) ? "bg-gradient-to-r from-orange-50 to-yellow-50 border-orange-200 font-bold" : "bg-gray-50 text-gray-400 border-gray-200 line-through";
                    }
                } else if (isAlignedDepart) {
                    if (onlySpotDepart) {
                        arrowIndicator = '<span class="text-indigo-500 font-extrabold text-xs">→</span>';
                        bgClass = isDepartFlightDay ? "bg-indigo-50 border-indigo-300 font-bold" : "bg-indigo-50/50 text-gray-400 border-gray-200 line-through";
                    } else {
                        arrowIndicator = '<span class="text-orange-500 font-extrabold text-xs">→</span>';
                        bgClass = isDepartFlightDay ? "bg-orange-50 border-orange-300 font-bold" : "bg-orange-50/50 text-gray-400 border-gray-200 line-through";
                    }
                } else if (isAlignedReturn) {
                    if (onlySpotReturn) {
                        arrowIndicator = '<span class="text-purple-500 font-extrabold text-xs">←</span>';
                        bgClass = isReturnFlightDay ? "bg-purple-50 border-purple-300 font-bold" : "bg-purple-50/50 text-gray-400 border-gray-200 line-through";
                    } else {
                        arrowIndicator = '<span class="text-yellow-500 font-extrabold text-xs">←</span>';
                        bgClass = isReturnFlightDay ? "bg-yellow-50 border-yellow-300 font-bold" : "bg-yellow-50/50 text-gray-400 border-gray-200 line-through";
                    }
                } else if (isFlightDay) { bgClass = "bg-gray-50 text-gray-800 border-gray-200 hover:bg-gray-100"; } 
                else { bgClass = "bg-white text-gray-400 border-gray-100 opacity-60"; }

                const dayCell = document.createElement('div');
                dayCell.className = `h-12 p-1.5 border rounded-xl transition-all cursor-pointer flex flex-col justify-between ${bgClass}`;
                dayCell.setAttribute('data-day-cell', 'true'); dayCell.setAttribute('data-day-date', dateStr); dayCell.setAttribute('data-day-flight', isFlightDay); dayCell.setAttribute('data-day-num', day);

                let iconsHtml = arrowIndicator;
                if (arrowIndicator) {
                    const specificFlightChecked = (isAlignedDepart && isAlignedReturn) ? (isDepartFlightDay && isReturnFlightDay) : (isAlignedDepart ? isDepartFlightDay : isReturnFlightDay);
                    if (!specificFlightChecked) iconsHtml += '<i class="fa-solid fa-triangle-exclamation text-rose-400 text-[9px] ml-0.5"></i>';
                }
                if (isNogo) iconsHtml = '<span class="text-rose-500 text-[8px] font-bold">✖ 無法</span>';
                dayCell.innerHTML = `<span class="text-[10px] font-bold block">${day}</span><div class="flex justify-between items-center text-[10px] h-3">${iconsHtml}</div>`;
                daysGrid.appendChild(dayCell);
            }
            wrapper.appendChild(daysGrid); return wrapper;
        }

        function handleCalendarCellClick(dateStr, isFlightDay, dayNum) {
            const filterType = document.getElementById('calendar-type-select').value;
            const hideSpot = document.getElementById('calendar-hide-spot')?.checked;
            const targetYear = new Date(dateStr).getFullYear();
            const val = document.getElementById('calendar-route-select')?.value || "all";
            let matchedRecords = [];

            records.forEach(r => {
                if (hideSpot && r.source_type === 'Spot') return;
                if (filterType !== 'all') { if (r.source_type === 'Spot') return; if (r.promo_category !== filterType) return; }
                if (!isRouteMatchingSelected(r, val)) return;

                const { alignedDepart, alignedReturn } = getRecordAlignedDates(r, targetYear);
                if (alignedDepart && formatDate(alignedDepart) === dateStr) matchedRecords.push({ type: 'aligned', direction: '去程', originDate: r.depart_date, data: r });
                if (alignedReturn && formatDate(alignedReturn) === dateStr) matchedRecords.push({ type: 'aligned', direction: '回程', originDate: r.return_date, data: r });
            });
            showDayDetail(dayNum, new Date(dateStr), matchedRecords, isFlightDay);

        function startEditRecord(id) {

            document.getElementById('btn-submit-record-text').textContent = "儲存紀錄"; document.getElementById('btn-cancel-edit-record').classList.add('hidden');
            document.getElementById('record-form').reset(); updatePromoCategoryVisibility(); showToast("已取消編輯", "info");

        async function handleRecordSubmit(e) {
            e.preventDefault();
            const departFrom = document.getElementById('record-depart-from').value, departTo = document.getElementById('record-depart-to').value;
            const departPrice = document.getElementById('record-depart-price').value ? parseInt(document.getElementById('record-depart-price').value) : null;
            const returnFrom = document.getElementById('record-return-from').value, returnTo = document.getElementById('record-return-to').value;
            const returnPrice = document.getElementById('record-return-price').value ? parseInt(document.getElementById('record-return-price').value) : null;

            const departDatesStr = document.getElementById('record-depart-date').value;
            const returnDatesStr = document.getElementById('record-return-date').value;
            const departDates = departDatesStr ? departDatesStr.split(', ') : [];
            const returnDates = returnDatesStr ? returnDatesStr.split(', ') : [];

            if (departDates.length === 0 && returnDates.length === 0) return showToast("請至少填寫一個歷史日期！", "error");

            const sourceType = document.querySelector('input[name="source_type"]:checked').value;
            const promoCategory = sourceType === 'Spot' ? 'none' : document.querySelector('input[name="promo_category"]:checked').value;

            // 如果編輯模式，僅更新那一筆 (假設不會突然改成多個日期)
            if (editingRecordId) {
                const index = records.findIndex(item => item.id === editingRecordId);
                if (index > -1) {
                    records[index] = { ...records[index], source_type: sourceType, promo_category: promoCategory,
                        depart_from: departFrom, depart_to: departTo, depart_price: departPrice, depart_date: departDates[0] || null,
                        return_from: returnFrom, return_to: returnTo, return_price: returnPrice, return_date: returnDates[0] || null
                    };
                    showToast("紀錄修改成功！");
                }
                cancelEditRecord();
            } else {
                // 新增模式，支援多選日期拆筆
                const maxDates = Math.max(1, departDates.length, returnDates.length);
                for (let i = 0; i < maxDates; i++) {
                    // 若數量不對稱，就用第一個日期補足搭配
                    const dDate = departDates[i] || (departDates.length ? departDates[0] : null);
                    const rDate = returnDates[i] || (returnDates.length ? returnDates[0] : null);
                    
                    records.push({
                        id: 'r_' + Date.now() + '_' + i, source_type: sourceType, promo_category: promoCategory,
                        depart_from: departFrom, depart_to: departTo, depart_price: departPrice, depart_date: dDate,
                        return_from: returnFrom, return_to: returnTo, return_price: returnPrice, return_date: rDate
                    });
                }
                playSuccessAnimation();
                fpDepart.clear(); fpReturn.clear();
                document.getElementById('record-depart-price').value = ''; document.getElementById('record-return-price').value = '';
            }
            await syncData(); populateRouteDropdowns(); updateDashboard(); renderRecordsTable();
        }

                records = records.filter(r => r.id !== id); if (editingRecordId === id) cancelEditRecord();
                await syncData(); populateRouteDropdowns(); updateDashboard(); renderRecordsTable(); showToast("紀錄已刪除。");
            });

        function toggleAllCollapse() {
            const mode = document.getElementById('record-group-mode').value;
            if (mode === 'none') return showToast("不分類模式無可摺疊之分組", "info");
            const searchVal = document.getElementById('record-search')?.value.toLowerCase() || "";
            const filtered = records.filter(r => `${r.depart_from} ${r.depart_to} ${r.return_from} ${r.return_to} ${r.promo_category}`.toLowerCase().includes(searchVal));
            let groupKeys = new Set();
            if (mode === 'city') filtered.forEach(r => groupKeys.add(getDestinationFromRoute(r.depart_to || r.depart_from || r.return_from || r.return_to) ? `${getAirportName(getDestinationFromRoute(r.depart_to || r.depart_from || r.return_from || r.return_to))} (${getDestinationFromRoute(r.depart_to || r.depart_from || r.return_from || r.return_to)})` : "其他"));
            else if (mode === 'category') filtered.forEach(r => groupKeys.add(r.promo_category === 'anniversary' ? "週年大促紀錄" : (r.promo_category === 'easter' ? "復活節促銷紀錄" : "未分類 / 官網自查")));
            const keysArr = Array.from(groupKeys); if (keysArr.length === 0) return;
            const hasExpanded = keysArr.some(k => collapsedGroups[k] !== true);
            keysArr.forEach(k => collapsedGroups[k] = hasExpanded);
            renderRecordsTable(); showToast(hasExpanded ? "已一鍵摺疊" : "已一鍵展開", "info");
        }

        function renderRecordsTable() {
            const container = document.getElementById('records-grouped-container');
            const mode = document.getElementById('record-group-mode').value;
            const searchVal = document.getElementById('record-search')?.value.toLowerCase() || "";
            
            const btnCollapseAll = document.getElementById('btn-collapse-all');
            const btnCollapseIcon = document.getElementById('btn-collapse-all-icon');
            const btnCollapseText = document.getElementById('btn-collapse-all-text');
            
            if (mode === 'none') {
                btnCollapseAll.className = "bg-gray-50 text-gray-300 rounded-xl px-2.5 py-2.5 shrink-0 flex items-center gap-1 cursor-not-allowed opacity-50";
                btnCollapseIcon.className = "fa-solid fa-compress text-gray-300";
            } else {
                btnCollapseAll.className = "bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-xl px-2.5 py-2.5 shrink-0 shadow-sm flex items-center gap-1 font-bold text-[10px] cursor-pointer";
            }

            const filtered = records.filter(r => `${r.depart_from} ${r.depart_to} ${r.return_from} ${r.return_to} ${r.promo_category} ${getAirportName(r.depart_from)} ${getAirportName(r.depart_to)}`.toLowerCase().includes(searchVal));
            if (filtered.length === 0) { container.innerHTML = `<div class="text-center text-gray-500 text-xs py-8 bg-gray-50 border border-dashed border-gray-200 rounded-2xl">暫無紀錄</div>`; return; }

            let groups = {};
            if (mode === 'none') { groups['all'] = { name: "所有促銷紀錄", records: filtered }; } 
            else if (mode === 'city') {
                filtered.forEach(r => {
                    const destCode = getDestinationFromRoute(r.depart_to || r.depart_from || r.return_from || r.return_to);
                    const cityName = destCode ? `${getAirportName(destCode)} (${destCode})` : "其他未定義目的地";
                    if (!groups[cityName]) groups[cityName] = { name: cityName, records: [] }; groups[cityName].records.push(r);
                });
            } else if (mode === 'category') {
                filtered.forEach(r => {
                    const catName = r.promo_category === 'anniversary' ? "週年大促紀錄" : (r.promo_category === 'easter' ? "復活節促銷紀錄" : "未分類 / 官網自查");
                    if (!groups[catName]) groups[catName] = { name: catName, records: [] }; groups[catName].records.push(r);
                });
            }

            if (mode !== 'none') {
                const hasExpanded = Object.keys(groups).some(k => collapsedGroups[k] !== true);
                btnCollapseText.textContent = hasExpanded ? "摺疊" : "展開";
                btnCollapseIcon.className = hasExpanded ? "fa-solid fa-compress" : "fa-solid fa-expand";
            }

            container.innerHTML = "";
            Object.keys(groups).forEach(groupKey => {
                const group = groups[groupKey]; const isCollapsed = collapsedGroups[groupKey] === true; 
                const groupDiv = document.createElement('div'); groupDiv.className = "border border-gray-200 rounded-2xl overflow-hidden bg-white minimal-shadow";
                groupDiv.innerHTML = `
                    <div class="bg-gray-50 px-5 py-3.5 flex items-center justify-between cursor-pointer hover:bg-gray-100 border-b border-gray-200" data-toggle-group="${groupKey}">
                        <div class="flex items-center gap-2"><span class="font-bold text-xs text-gray-800">${group.name}</span><span class="text-[9px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded-md font-mono">${group.records.length} 筆</span></div>
                        <div class="text-gray-400 text-[10px] font-bold"><i class="fa-solid ${isCollapsed ? 'fa-chevron-down' : 'fa-chevron-up'}"></i></div>
                    </div>
                `;
                if (!isCollapsed) {
                    const contentDiv = document.createElement('div'); contentDiv.className = "p-4 space-y-4";
                    let rowsHtml = "", mobileCardsHtml = "";
                    group.records.forEach(r => {
                        let promoBadge = r.promo_category === 'anniversary' ? '<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-[9px] font-bold">週年大促</span>' : (r.promo_category === 'easter' ? '<span class="bg-gray-50 text-gray-600 px-2 py-1 rounded text-[9px] font-bold">復活節</span>' : '<span class="bg-gray-50 text-gray-500 px-2 py-1 rounded text-[9px] font-bold">一般查價</span>');
                        const sourceBadge = r.source_type === 'PTT' ? '<span class="text-[9px] text-orange-500 border border-orange-200 px-1.5 py-0.5 rounded bg-white font-bold">PTT</span>' : '<span class="text-[9px] text-indigo-500 border border-indigo-200 px-1.5 py-0.5 rounded bg-white font-bold">官網</span>';
                        const dInfo = r.depart_date ? `<div class="font-bold text-gray-800 text-[11px]">${getAirportName(r.depart_from)} → ${getAirportName(r.depart_to)}</div><div class="text-gray-500 font-mono text-[9px] mt-0.5">${r.depart_date}</div>` : `<span class="text-gray-400 text-[10px]">無</span>`;
                        const rInfo = r.return_date ? `<div class="font-bold text-gray-800 text-[11px]">${getAirportName(r.return_from)} → ${getAirportName(r.return_to)}</div><div class="text-gray-500 font-mono text-[9px] mt-0.5">${r.return_date}</div>` : `<span class="text-gray-400 text-[10px]">無</span>`;
                        const isEd = editingRecordId === r.id;

                        rowsHtml += `<tr class="border-b border-gray-50 ${isEd ? 'bg-amber-50/30' : ''}">
                            <td class="p-3"><div class="flex flex-col gap-1.5 items-start">${promoBadge}${sourceBadge}</div></td>
                            <td class="p-3">${dInfo}</td><td class="p-3">${rInfo}</td>
                            <td class="p-3"><div class="font-mono text-[10px] text-gray-800 font-semibold mb-1">去: NT$${formatPrice(r.depart_price)}</div><div class="font-mono text-[10px] text-gray-800 font-semibold">回: NT$${formatPrice(r.return_price)}</div></td>
                            <td class="p-3 text-center"><button data-edit-record="${r.id}" class="text-gray-400 hover:text-gray-800 p-1"><i class="fa-solid fa-pen-to-square"></i></button><button data-delete-record="${r.id}" class="text-gray-400 hover:text-rose-500 p-1"><i class="fa-solid fa-trash-can"></i></button></td>
                        </tr>`;

                        mobileCardsHtml += `<div class="bg-white border rounded-xl p-4 space-y-3 border-gray-200 ${isEd ? 'bg-amber-50/20 border-amber-300' : ''}">
                            <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
                                <div class="flex gap-1.5">${promoBadge}${sourceBadge}</div>
                                <div class="flex gap-1"><button data-edit-record="${r.id}" class="text-gray-500 p-1.5"><i class="fa-solid fa-pen-to-square text-[10px]"></i></button><button data-delete-record="${r.id}" class="text-gray-500 p-1.5"><i class="fa-solid fa-trash-can text-[10px]"></i></button></div>
                            </div>
                            <div class="grid grid-cols-2 gap-4"><div class="pl-2 border-l-2 border-orange-300">${dInfo}</div><div class="pl-2 border-l-2 border-yellow-300">${rInfo}</div></div>
                            <div class="bg-gray-50 p-2 rounded flex justify-between text-[10px]"><span>未稅價</span><span class="font-mono font-bold">去: NT$${formatPrice(r.depart_price)} / 回: NT$${formatPrice(r.return_price)}</span></div>
                        </div>`;
                    });
                    contentDiv.innerHTML = `<div class="hidden md:block overflow-x-auto"><table class="w-full text-xs text-left"><thead><tr class="bg-gray-50 text-gray-500 border-b border-gray-200 text-[10px]"><th class="p-3">性質</th><th class="p-3">去程</th><th class="p-3">回程</th><th class="p-3">未稅票價</th><th class="p-3 text-center">操作</th></tr></thead><tbody class="divide-y divide-gray-100">${rowsHtml}</tbody></table></div><div class="block md:hidden space-y-4">${mobileCardsHtml}</div>`;
                    groupDiv.appendChild(contentDiv);
                }
                container.appendChild(groupDiv);
            });
        }

        async function handleScheduleSubmit(e) {
            e.preventDefault(); const route = document.getElementById('sched-route').value.toUpperCase().trim(), fromZh = document.getElementById('sched-from-zh').value.trim(), toZh = document.getElementById('sched-to-zh').value.trim();
            const checkedDays = Array.from(document.querySelectorAll('input[name="sched_days"]:checked')).map(cb => parseInt(cb.value));
            if (checkedDays.length === 0) return showToast("請點選營運星期", "error");
            const parts = route.split('-'); if (parts.length === 2) { if (fromZh) airportZh[parts[0]] = fromZh; if (toZh) airportZh[parts[1]] = toZh; }
            if (editingRoute) { const idx = schedules.findIndex(s => s.route === editingRoute); if (idx !== -1) { schedules[idx].route = route; schedules[idx].days = checkedDays; } editingRoute = null; showToast("班表更新！"); } 
            else { const idx = schedules.findIndex(s => s.route === route); if (idx !== -1) schedules[idx].days = checkedDays; else schedules.push({ route, days: checkedDays }); showToast("班表設定！"); }
            await syncData(); resetScheduleForm(); populateRouteDropdowns(); updateDashboard(); renderSchedulesList();
        }
        function startEditSchedule(route) { editingRoute = route; const sched = schedules.find(s => s.route === route); if (!sched) return; document.getElementById('sched-route').value = sched.route; document.getElementById('sched-route').setAttribute('readonly', 'true'); const parts = route.split('-'); if (parts.length===2) { document.getElementById('sched-from-zh').value=airportZh[parts[0]]||""; document.getElementById('sched-to-zh').value=airportZh[parts[1]]||""; } document.querySelectorAll('input[name="sched_days"]').forEach(cb=>cb.checked=sched.days.includes(parseInt(cb.value))); document.getElementById('btn-submit-schedule').textContent='確認'; document.getElementById('btn-cancel-edit-sched').classList.remove('hidden'); document.getElementById('schedule-form').scrollIntoView(); }
        function startCreateScheduleForAirport(ac) { editingRoute=null; resetScheduleForm(); document.getElementById('sched-route').value=`TPE-${ac}`; document.getElementById('sched-from-zh').value="台北桃園"; document.getElementById('sched-to-zh').value=airportZh[ac]||""; document.getElementById('btn-cancel-edit-sched').classList.remove('hidden'); document.getElementById('schedule-form').scrollIntoView(); }
        function cancelEditSchedule() { editingRoute = null; resetScheduleForm(); }
        function resetScheduleForm() { document.getElementById('schedule-form').reset(); document.getElementById('sched-route').removeAttribute('readonly'); document.getElementById('btn-submit-schedule').textContent='設定'; document.getElementById('btn-cancel-edit-sched').classList.add('hidden'); }
        async function deleteSchedule(route) { showConfirm("刪除", `清除 ${route} 班表？`, async () => { schedules = schedules.filter(s => s.route !== route); await syncData(); populateRouteDropdowns(); updateDashboard(); renderSchedulesList(); showToast("已清除。"); }); }

        function renderSchedulesList() {
            const container = document.getElementById('schedules-list-container'); container.innerHTML = "";
            for (const [regKey, region] of Object.entries(regions)) {
                const groupWrapper = document.createElement('div'); groupWrapper.className = "space-y-3";
                groupWrapper.innerHTML = `<div class="text-xs font-bold text-gray-700 bg-gray-50 px-4 py-2.5 rounded-xl"><i class="fa-solid fa-map-location-dot"></i> ${region.name}</div>`;
                const cardsGrid = document.createElement('div'); cardsGrid.className = "grid grid-cols-1 md:grid-cols-3 gap-4";
                region.airports.forEach(ac => {
                    const sched = schedules.find(s => getDestinationFromRoute(s.route) === ac); const card = document.createElement('div');
                    if (sched) {
                        card.className = "bg-white border rounded-xl p-4 flex justify-between shadow-sm text-xs minimal-shadow";
                        let dHtml = ""; [1,2,3,4,5,6,0].forEach(d => dHtml += `<span class="w-[22px] h-[22px] inline-flex items-center justify-center text-[9px] font-bold rounded-md ${sched.days.includes(d)?'bg-gray-800 text-white':'bg-gray-100 text-gray-400'}">${weekDaysChinese[d]}</span>`);
                        card.innerHTML = `<div class="space-y-2.5"><div class="font-bold text-gray-800">${getAirportName(ac)} (${sched.route})</div><div class="flex gap-1.5">${dHtml}</div></div><div class="flex gap-1"><button data-edit-schedule="${sched.route}" class="text-gray-400 hover:text-gray-800 p-2"><i class="fa-solid fa-pen-to-square"></i></button></div>`;
                    } else {
                        card.className = "bg-gray-50/50 border border-dashed rounded-xl p-4 flex justify-between text-xs";
                        card.innerHTML = `<div class="space-y-1.5"><div class="font-bold text-gray-500">${getAirportName(ac)}</div><div class="text-[10px] text-gray-400">未啟用</div></div><button data-create-schedule="${ac}" class="bg-white border px-3 py-2 rounded-lg shadow-sm">設定</button>`;
                    }
                    cardsGrid.appendChild(card);
                });
                groupWrapper.appendChild(cardsGrid); container.appendChild(groupWrapper);
            }
        }
    </script>
