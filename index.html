<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虎航促銷預測系統 v6.3</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="虎航預測">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #F9FAFB; /* Tailwind gray-50 */
            color: #1F2937; /* Tailwind gray-800 */
        }

        /* 自定義滾動條：極簡細緻 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB; /* gray-300 */
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF; /* gray-400 */
        }

        /* 日式極簡柔和陰影 */
        .minimal-shadow {
            box-shadow: 0 4px 24px -6px rgba(0, 0, 0, 0.04);
        }
        
        /* 斜線背景，用於標記無法出國的日期 (淺紅) */
        .nogo-pattern {
            background-color: #FEF2F2;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(239, 68, 68, 0.05) 4px, rgba(239, 68, 68, 0.05) 8px);
            border-color: #FCA5A5 !important;
        }

        /* 歷史日期欄位高度設定 */
        .custom-date-input {
            height: 16px;      
            padding: 0.375rem; 
        }

        /* 清除 select 預設外觀以利自訂 */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239CA3AF' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20 md:pb-0">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="confirm-modal" class="fixed inset-0 bg-gray-900/20 backdrop-blur-sm z-[100] flex items-center justify-center hidden transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 max-w-sm w-full p-6 space-y-5 mx-4 minimal-shadow">
            <h3 class="text-sm font-bold text-gray-800 tracking-wider flex items-center gap-2" id="confirm-title">
                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 確認執行
            </h3>
            <p class="text-xs text-gray-500 leading-relaxed" id="confirm-message">確定要執行這項操作嗎？</p>
            <div class="flex justify-end gap-2 text-xs font-semibold pt-2">
                <button id="confirm-cancel" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition duration-200">
                    取消
                </button>
                <button id="confirm-ok" class="px-4 py-2.5 bg-gray-900 hover:bg-black text-white rounded-xl transition duration-200 shadow-sm">
                    確認執行
                </button>
            </div>
        </div>
    </div>

    <!-- 頂部導航欄 (淺色系) -->
    <header class="bg-white text-gray-800 shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center text-gray-800 shadow-sm">
                        <i class="fa-solid fa-plane-departure text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-xs sm:text-sm font-bold tracking-wider text-gray-800">
                            虎航促銷預測系統 <span class="text-[9px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-md ml-1 font-mono border border-gray-200">v6.3</span>
                        </h1>
                    </div>
                </div>
                
                <div class="hidden md:flex space-x-1">
                    <button id="nav-dashboard" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 text-gray-900 transition duration-200">
                        <i class="fa-solid fa-calendar-days mr-1.5 text-gray-500"></i> 觀測月曆
                    </button>
                    <button id="nav-records" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition duration-200">
                        <i class="fa-solid fa-list mr-1.5 opacity-70"></i> 促銷紀錄
                    </button>
                    <button id="nav-schedules" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition duration-200">
                        <i class="fa-solid fa-clock mr-1.5 opacity-70"></i> 排班設定
                    </button>
                </div>
                
                <!-- Firebase 狀態 -->
                <div class="flex items-center gap-2">
                    <button id="btn-toggle-firebase" class="text-[10px] bg-white hover:bg-gray-50 text-gray-600 px-2.5 py-1.5 rounded-lg transition duration-200 flex items-center gap-1.5 border border-gray-200 shadow-sm font-medium">
                        <i class="fa-solid fa-cloud text-gray-400"></i>
                        <span id="firebase-status-text">雲端同步讀取中...</span>
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-gray-300" id="firebase-indicator"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="firebase-config-panel" class="bg-gray-50 border-b border-gray-200 px-4 py-5 hidden transition-all duration-300">
        <div class="max-w-7xl mx-auto space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-gears text-gray-400"></i> Firebase 雲端同步設定
                </h3>
                <button id="btn-close-firebase" class="text-xs text-gray-500 hover:text-gray-800 font-medium bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">收合 <i class="fa-solid fa-chevron-up ml-1"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3 text-xs">
                <div class="md:col-span-2">
                    <span class="text-[10px] text-gray-500 block mb-1 font-semibold">apiKey</span>
                    <input type="text" id="fb-apiKey" placeholder="AIzaSy..." class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800 outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 transition">
                </div>
                <div>
                    <span class="text-[10px] text-gray-500 block mb-1 font-semibold">authDomain</span>
                    <input type="text" id="fb-authDomain" placeholder="your-app.firebaseapp.com" class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800 outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 transition">
                </div>
                <div>
                    <span class="text-[10px] text-gray-500 block mb-1 font-semibold">projectId</span>
                    <input type="text" id="fb-projectId" placeholder="your-app" class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800 outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 transition">
                </div>
                <div class="md:col-span-2 flex items-end gap-2">
                    <div class="flex-grow">
                        <span class="text-[10px] text-gray-500 block mb-1 font-semibold">appId</span>
                        <input type="text" id="fb-appId" placeholder="1:12345:web:abcd" class="w-full bg-white border border-gray-200 rounded-lg p-2 font-mono text-[10px] text-gray-800 outline-none focus:border-gray-400 focus:ring-1 focus:ring-gray-400 transition">
                    </div>
                    <button id="btn-save-firebase" class="bg-gray-900 hover:bg-black text-white px-4 py-2 h-[34px] rounded-lg text-xs font-semibold transition shrink-0 shadow-sm">
                        連線
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 行動裝置底欄導航 (淺色系) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 grid grid-cols-3 text-center py-2 z-50 text-[10px] shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
        <button id="mob-dashboard" class="mob-tab-btn text-gray-900 font-bold flex flex-col items-center">
            <i class="fa-solid fa-calendar-days text-base mb-1"></i>
            <span>觀測月曆</span>
        </button>
        <button id="mob-records" class="mob-tab-btn text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-list text-base mb-1"></i>
            <span>促銷紀錄</span>
        </button>
        <button id="mob-schedules" class="mob-tab-btn text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-clock text-base mb-1"></i>
            <span>排班設定</span>
        </button>
    </div>

    <!-- 主體內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 mb-16 md:mb-8">

        <div id="tab-dashboard" class="tab-content block space-y-6">
            
            <!-- 篩選與基本配置區 -->
            <div class="bg-white rounded-2xl p-5 border border-gray-100 minimal-shadow">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">
                            <i class="fa-solid fa-route mr-1 text-gray-400"></i> 選擇航點
                        </label>
                        <select id="calendar-route-select" class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-medium rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-gray-400 focus:bg-white transition-colors cursor-pointer">
                            <!-- JS 動態依區域渲染中文化目的地名稱 -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">
                            <i class="fa-solid fa-filter mr-1 text-gray-400"></i> 促銷類型篩選
                        </label>
                        <div class="space-y-3">
                            <select id="calendar-type-select" class="w-full bg-gray-50 border border-gray-200 text-gray-800 font-medium rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-gray-400 focus:bg-white transition-colors cursor-pointer">
                                <option value="all" selected>全部紀錄 (包含自查)</option>
                                <option value="anniversary">九月 週年促銷</option>
                                <option value="easter">三月 復活節促銷</option>
                            </select>
                            <label class="flex items-center gap-2 cursor-pointer pl-1 group w-fit">
                                <input type="checkbox" id="calendar-hide-spot" class="accent-gray-800 rounded border-gray-300 w-3.5 h-3.5 transition">
                                <span class="text-[11px] font-medium text-gray-500 group-hover:text-gray-800 transition">暫時隱藏「官網最低價」紀錄</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 月曆與說明區塊 -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                <!-- 左側：班表營運狀態 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 space-y-5 lg:col-span-1 minimal-shadow h-fit">
                    <h3 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-info text-gray-400"></i> 當前航線營運日
                    </h3>
                    
                    <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                        <div class="grid grid-cols-7 gap-1.5 text-center text-[10px]" id="route-days-preview">
                            <!-- JS 動態生成 -->
                        </div>
                    </div>

                    <!-- 星期對齊說明圖例 -->
                    <div class="bg-white rounded-xl p-3 border border-gray-100 text-[10px] space-y-3 shadow-sm">
                        <h4 class="font-bold text-gray-700 flex items-center gap-1.5 pb-2 border-b border-gray-50">
                            <i class="fa-solid fa-sliders text-gray-400"></i> 圖例對照
                        </h4>
                        <div class="space-y-2.5 font-medium text-gray-600">
                            <div class="flex items-center gap-2">
                                <span class="w-6 text-center text-amber-500 font-extrabold text-sm">→</span>
                                <span>去程預估日</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-6 text-center text-sky-500 font-extrabold text-sm">←</span>
                                <span>回程預估日</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-sky-500 font-extrabold text-sm">⇆</span>
                                <span class="font-bold text-gray-800">雙向預估日</span>
                            </div>
                            <div class="flex items-center gap-2 border-t border-gray-100 pt-2.5">
                                <span class="w-6 text-center text-emerald-500 font-extrabold text-sm">→</span>
                                <span class="font-bold text-emerald-600">官網最低價預估</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-3 rounded nogo-pattern inline-block border"></span>
                                <span class="text-rose-500">無法出國日期</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右側：雙月份並列月曆 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 lg:col-span-3 flex flex-col space-y-4 minimal-shadow">
                    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
                        <div class="flex items-center space-x-2">
                            <button id="btn-prev-month" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500 hover:text-gray-900 transition duration-200">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <span class="text-xs font-bold text-gray-800 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200" id="calendar-range-label">讀取中...</span>
                            <button id="btn-next-month" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500 hover:text-gray-900 transition duration-200">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="dual-calendars-container">
                        <!-- JS 動態渲染兩個月份 -->
                    </div>
                    
                    <!-- 選定日期的細部解析 -->
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 hidden shadow-sm transition-all" id="calendar-day-detail">
                        <div class="flex items-start justify-between">
                            <h4 class="font-bold text-xs text-gray-800 flex items-center gap-1.5 mb-2">
                                <i class="fa-solid fa-circle-question text-gray-400"></i> 預估詳情
                            </h4>
                        </div>
                        <div id="calendar-day-detail-content" class="text-xs text-gray-600 leading-relaxed">
                            <!-- JS 動態寫入內容 -->
                        </div>
                        <!-- 無法出國標記切換鈕 -->
                        <div class="mt-3 pt-3 border-t border-gray-200 flex justify-end" id="nogo-action-area">
                            <!-- JS 動態渲染 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-records" class="tab-content hidden space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- 左側：新增/編輯 紀錄表單 -->
                <div class="bg-white rounded-2xl p-5 border border-gray-100 space-y-5 minimal-shadow h-fit">
                    <h3 class="text-xs font-bold text-gray-800 border-b border-gray-100 pb-3 flex items-center gap-1.5" id="form-title-text">
                        <i class="fa-solid fa-plus text-gray-400"></i> 新增促銷 / 查價紀錄
                    </h3>
                    
                    <form id="record-form" class="space-y-5 text-xs">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-2 tracking-wider">紀錄來源性質</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                    <input type="radio" name="source_type" value="PTT" checked class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">PTT回報</span>
                                </label>
                                <label class="flex items-center justify-center p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                    <input type="radio" name="source_type" value="Spot" class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">官網最低價</span>
                                </label>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="border-l-2 border-amber-400 pl-3 space-y-3 bg-amber-50/30 p-2 rounded-r-xl">
                                <span class="text-[10px] font-bold text-gray-800 tracking-wider">去程航班 (選填)</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">出發地</span>
                                        <select id="record-depart-from" class="w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none focus:border-gray-400 transition cursor-pointer text-[10px]">
                                            <!-- JS 動態渲染 -->
                                        </select>
                                    </div>
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">目的地</span>
                                        <select id="record-depart-to" class="w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none focus:border-gray-400 transition cursor-pointer text-[10px]">
                                            <!-- JS 動態渲染 -->
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">歷史日期</span>
                                        <input type="date" id="record-depart-date" class="custom-date-input w-[95%] bg-white border border-gray-200 rounded-lg font-medium outline-none text-gray-800 focus:border-gray-400 transition">
                                    </div>
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">未稅票價</span>
                                        <input type="number" id="record-depart-price" inputmode="numeric" pattern="[0-9]*" placeholder="如: 1599" class="w-full bg-white border border-gray-200 rounded-lg p-2 outline-none focus:border-gray-400 transition text-gray-800">
                                    </div>
                                </div>
                            </div>

                            <div class="border-l-2 border-sky-400 pl-3 space-y-3 bg-sky-50/30 p-2 rounded-r-xl">
                                <span class="text-[10px] font-bold text-gray-800 tracking-wider">回程航班 (選填)</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">出發地</span>
                                        <select id="record-return-from" class="w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none focus:border-gray-400 transition cursor-pointer text-[10px]">
                                            <!-- JS 動態渲染 -->
                                        </select>
                                    </div>
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">目的地</span>
                                        <select id="record-return-to" class="w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-lg p-2 outline-none focus:border-gray-400 transition cursor-pointer text-[10px]">
                                            <!-- JS 動態渲染 -->
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">歷史日期</span>
                                        <input type="date" id="record-return-date" class="custom-date-input w-[95%] bg-white border border-gray-200 rounded-lg font-medium outline-none text-gray-800 focus:border-gray-400 transition">
                                    </div>
                                    <div>
                                        <span class="text-[9px] text-gray-500 block mb-1">未稅票價</span>
                                        <input type="number" id="record-return-price" inputmode="numeric" pattern="[0-9]*" placeholder="如: 1899" class="w-full bg-white border border-gray-200 rounded-lg p-2 outline-none focus:border-gray-400 transition text-gray-800">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 促銷檔期單選鈕 (會動態隱藏) -->
                        <div id="promo-category-container" class="pt-1">
                            <label class="block text-[10px] font-bold text-gray-500 mb-2 tracking-wider">促銷檔期分類</label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center justify-center p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                    <input type="radio" name="promo_category" value="easter" checked class="mr-2 accent-gray-800 w-3.5 h-3.5">
                                    <span class="text-gray-700 font-semibold text-[11px]">復活節促銷</span>
                                </label>
                                <label class="flex items-center justify-center p-2.5 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                    <input type="radio" name="promo_category" value="anniversary" class="mr-2 accent-gray-800 w-3.5 h-3.5">

                        const cloud = docSnap.data();

                        nogoDays = cloud.nogoDays || [];

        function getAlignedDate(originalDateStr, targetYear) {
            const orig = new Date(originalDateStr);
            if (isNaN(orig)) return null;
            const origMonth = orig.getMonth();
            const origYear = orig.getFullYear();

            function getFirstWeekStartMonday(year, month) {
                const firstDay = new Date(year, month, 1);
                const firstDayWeekday = firstDay.getDay(); 
                if (firstDayWeekday === 0) return new Date(year, month, 2); 
                else return new Date(year, month, 1 - (firstDayWeekday - 1));
            }

            const origStartMonday = getFirstWeekStartMonday(origYear, origMonth);
            const diffDays = Math.floor((orig.getTime() - origStartMonday.getTime()) / (1000 * 60 * 60 * 24));
            
            const targetStartMonday = getFirstWeekStartMonday(targetYear, origMonth);
            const projectedDate = new Date(targetStartMonday.getTime());
            projectedDate.setDate(projectedDate.getDate() + (Math.floor(diffDays / 7) * 7) + (diffDays % 7));

            return projectedDate;
        }

        function formatDate(date) {
            if (!date) return "";
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        const weekDaysChinese = ["日", "一", "二", "三", "四", "五", "六"];
        function getWeekdayName(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d) ? "" : "週" + weekDaysChinese[d.getDay()];
        }

        function getUniqueDestinations() {
            const taiwanAirports = ["TPE"];
            const dests = new Set();
            schedules.forEach(s => {
                const parts = s.route.split('-');
                if (parts.length === 2) {
                    if (!taiwanAirports.includes(parts[0])) dests.add(parts[0]);
                    if (!taiwanAirports.includes(parts[1])) dests.add(parts[1]);
                }
            });
            records.forEach(r => {
                if (r.depart_to && !taiwanAirports.includes(r.depart_to)) dests.add(r.depart_to);
                if (r.depart_from && !taiwanAirports.includes(r.depart_from)) dests.add(r.depart_from);
                if (r.return_to && !taiwanAirports.includes(r.return_to)) dests.add(r.return_to);
                if (r.return_from && !taiwanAirports.includes(r.return_from)) dests.add(r.return_from);
            });
            return Array.from(dests);
        }

            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            updateDashboard();

            renderRouteDaysPreview();
            renderDualCalendars();

        function isAirportFlightDay(airportCode, weekday) {
            const sched = schedules.find(s => s.route.includes(airportCode));
            return sched ? sched.days.includes(weekday) : true;
        }

        function getSelectedRouteDays() {
            const routeSelect = document.getElementById('calendar-route-select');
            const selectedValue = routeSelect ? (routeSelect.value || "all") : "all";
            
            if (selectedValue === 'all') {
                const days = new Set();
                schedules.forEach(s => s.days.forEach(d => days.add(d)));
                return Array.from(days);
            }
            if (selectedValue.startsWith('region_')) {
                const regionId = selectedValue.replace('region_', '');
                if (regionId === 'others') {
                    const defined = new Set();
                    for (const r of Object.values(regions)) r.airports.forEach(a => defined.add(a));
                    const otherDests = getUniqueDestinations().filter(c => !defined.has(c));
                    const days = new Set();
                    schedules.forEach(s => {
                        if (otherDests.includes(getDestinationFromRoute(s.route))) s.days.forEach(d => days.add(d));
                    });
                    return Array.from(days);
                }
                const regionAirports = regions[regionId]?.airports || [];
                const days = new Set();
                schedules.forEach(s => {
                    if (regionAirports.includes(getDestinationFromRoute(s.route))) s.days.forEach(d => days.add(d));
                });
                return Array.from(days);
            }
            const sched = schedules.find(s => s.route.includes(selectedValue));
            return sched ? sched.days : [0, 1, 2, 3, 4, 5, 6]; 
        }

        function isRouteMatchingSelected(r, selectedValue) {
            if (selectedValue === 'all') return true;
            if (selectedValue.startsWith('region_')) {
                const regionId = selectedValue.replace('region_', '');
                if (regionId === 'others') {
                    const defined = new Set();
                    for (const reg of Object.values(regions)) reg.airports.forEach(a => defined.add(a));
                    const otherDests = getUniqueDestinations().filter(c => !defined.has(c));
                    return otherDests.includes(r.depart_to) || otherDests.includes(r.depart_from) || otherDests.includes(r.return_to) || otherDests.includes(r.return_from);
                }
                const regionAirports = regions[regionId]?.airports || [];
                return regionAirports.includes(r.depart_to) || regionAirports.includes(r.depart_from) || regionAirports.includes(r.return_to) || regionAirports.includes(r.return_from);
            }
            return r.depart_to === selectedValue || r.depart_from === selectedValue || r.return_to === selectedValue || r.return_from === selectedValue;
        }

        function renderDualCalendars() {
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

        function buildMonthDOM(year, month) {
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            const wrapper = document.createElement('div');
            wrapper.className = "space-y-2";

            wrapper.innerHTML = `
                <div class="text-[11px] font-bold text-gray-800 bg-gray-50 py-2 px-3 rounded-xl flex justify-between border border-gray-200">
                    <span>${year}年 ${monthNames[month]}</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-[9px] text-gray-400 pb-1">
                    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
                </div>
            `;

            const daysGrid = document.createElement('div');
            daysGrid.className = "grid grid-cols-7 gap-1.5 text-xs";

            const firstDayOfMonth = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startWeekday = firstDayOfMonth.getDay(); 
            let emptyCellsCount = startWeekday === 0 ? 6 : startWeekday - 1;

            for (let i = 0; i < emptyCellsCount; i++) {
                daysGrid.innerHTML += `<div class="bg-gray-50/50 rounded-xl h-12 border border-transparent"></div>`;
            }

            const routeDays = getSelectedRouteDays();
            const filterType = document.getElementById('calendar-type-select').value;
            const hideSpot = document.getElementById('calendar-hide-spot')?.checked;
            const routeSelect = document.getElementById('calendar-route-select');
            const selectedValue = routeSelect ? (routeSelect.value || "all") : "all";

            for (let day = 1; day <= daysInMonth; day++) {
                const tempDate = new Date(year, month, day);
                const dateString = formatDate(tempDate);
                const weekday = tempDate.getDay(); 

                const isFlightDay = routeDays.includes(weekday);
                const isNogo = nogoDays.includes(dateString); 

                let isAlignedDepart = false; 
                let isAlignedReturn = false; 
                let isDepartFlightDay = false; 
                let isReturnFlightDay = false;

                let hasPTTDepart = false, hasSpotDepart = false;
                let hasPTTReturn = false, hasSpotReturn = false;

                records.forEach(r => {
                    if (hideSpot && r.source_type === 'Spot') return;
                    if (filterType !== 'all') {
                        if (r.source_type === 'Spot') return; 
                        if (r.promo_category !== filterType) return;
                    }
                    if (!isRouteMatchingSelected(r, selectedValue)) return;

                    const alignedDepart = r.depart_date ? getAlignedDate(r.depart_date, year) : null;
                    const alignedReturn = r.return_date ? getAlignedDate(r.return_date, year) : null;

                    if (alignedDepart && formatDate(alignedDepart) === dateString) {
                        isAlignedDepart = true;
                        if (r.source_type === 'Spot') hasSpotDepart = true; else hasPTTDepart = true;
                        const dest = r.depart_to || r.depart_from;
                        if (isAirportFlightDay(dest, weekday)) isDepartFlightDay = true;
                    }
                    if (alignedReturn && formatDate(alignedReturn) === dateString) {
                        isAlignedReturn = true;
                        if (r.source_type === 'Spot') hasSpotReturn = true; else hasPTTReturn = true;
                        const dest = r.return_to || r.return_from;
                        if (isAirportFlightDay(dest, weekday)) isReturnFlightDay = true;
                    }
                });

                let onlySpotDepart = hasSpotDepart && !hasPTTDepart;
                let onlySpotReturn = hasSpotReturn && !hasPTTReturn;

                let bgClass = "bg-white text-gray-800 border-gray-100 hover:bg-gray-50 hover:border-gray-200";
                let arrowIndicator = "";

                if (isNogo) {
                    bgClass = "nogo-pattern text-rose-500 shadow-none";
                } else if (isAlignedDepart && isAlignedReturn) {
                    if (onlySpotDepart && onlySpotReturn) {
                        arrowIndicator = '<span class="text-emerald-500 font-extrabold text-xs">⇆</span>';
                        bgClass = (isDepartFlightDay && isReturnFlightDay) ? "bg-emerald-50 border-emerald-300 font-bold" : "bg-emerald-50/50 text-gray-400 border-gray-200 line-through";
                    } else {
                        arrowIndicator = '<span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-sky-500 font-extrabold text-xs">⇆</span>';
                        bgClass = (isDepartFlightDay && isReturnFlightDay) ? "bg-gradient-to-r from-amber-50 to-sky-50 border-amber-200 font-bold" : "bg-gray-50 text-gray-400 border-gray-200 line-through";
                    }
                } else if (isAlignedDepart) {
                    if (onlySpotDepart) {
                        arrowIndicator = '<span class="text-emerald-500 font-extrabold text-xs">→</span>';
                        bgClass = isDepartFlightDay ? "bg-emerald-50 border-emerald-300 font-bold" : "bg-emerald-50/50 text-gray-400 border-gray-200 line-through";
                    } else {
                        arrowIndicator = '<span class="text-amber-500 font-extrabold text-xs">→</span>';
                        bgClass = isDepartFlightDay ? "bg-amber-50 border-amber-300 font-bold" : "bg-amber-50/50 text-gray-400 border-gray-200 line-through";
                    }
                } else if (isAlignedReturn) {
                    if (onlySpotReturn) {
                        arrowIndicator = '<span class="text-emerald-500 font-extrabold text-xs">←</span>';
                        bgClass = isReturnFlightDay ? "bg-emerald-50 border-emerald-300 font-bold" : "bg-emerald-50/50 text-gray-400 border-gray-200 line-through";
                    } else {
                        arrowIndicator = '<span class="text-sky-500 font-extrabold text-xs">←</span>';
                        bgClass = isReturnFlightDay ? "bg-sky-50 border-sky-300 font-bold" : "bg-sky-50/50 text-gray-400 border-gray-200 line-through";
                    }
                } else if (isFlightDay) {
                    bgClass = "bg-gray-50 text-gray-800 border-gray-200 hover:bg-gray-100";
                } else {
                    bgClass = "bg-white text-gray-400 border-gray-100 opacity-60";
                }

                const dayCell = document.createElement('div');
                dayCell.className = `h-12 p-1.5 border rounded-xl transition-all cursor-pointer flex flex-col justify-between ${bgClass}`;
                dayCell.setAttribute('data-day-cell', 'true');
                dayCell.setAttribute('data-day-date', dateString);
                dayCell.setAttribute('data-day-flight', isFlightDay ? 'true' : 'false');
                dayCell.setAttribute('data-day-num', day);

                let iconsHtml = arrowIndicator;
                if (arrowIndicator) {
                    const specificFlightChecked = (isAlignedDepart && isAlignedReturn) ? (isDepartFlightDay && isReturnFlightDay) : (isAlignedDepart ? isDepartFlightDay : isReturnFlightDay);
                    if (!specificFlightChecked) iconsHtml += '<i class="fa-solid fa-triangle-exclamation text-rose-400 text-[9px] ml-0.5"></i>';
                }
                if (isNogo) iconsHtml = '<span class="text-rose-500 text-[8px] font-bold">✖ 無法</span>';

                dayCell.innerHTML = `<span class="text-[10px] font-bold block">${day}</span><div class="flex justify-between items-center text-[10px] h-3">${iconsHtml}</div>`;
                daysGrid.appendChild(dayCell);
            }
            wrapper.appendChild(daysGrid);
            return wrapper;
        }

        function handleCalendarCellClick(dateString, isFlightDay, dayNum) {
            const filterType = document.getElementById('calendar-type-select').value;
            const hideSpot = document.getElementById('calendar-hide-spot')?.checked;
            const targetYear = new Date(dateString).getFullYear();
            const routeSelect = document.getElementById('calendar-route-select');
            const selectedValue = routeSelect ? (routeSelect.value || "all") : "all";
            let matchedRecords = [];

            records.forEach(r => {
                if (hideSpot && r.source_type === 'Spot') return;
                if (filterType !== 'all') {
                    if (r.source_type === 'Spot') return;
                    if (r.promo_category !== filterType) return;
                }
                if (!isRouteMatchingSelected(r, selectedValue)) return;

                const alignedDepart = r.depart_date ? getAlignedDate(r.depart_date, targetYear) : null;
                const alignedReturn = r.return_date ? getAlignedDate(r.return_date, targetYear) : null;

                if (alignedDepart && formatDate(alignedDepart) === dateString) {
                    matchedRecords.push({ type: 'aligned', direction: '去程', originDate: r.depart_date, data: r });
                }
                if (alignedReturn && formatDate(alignedReturn) === dateString) {
                    matchedRecords.push({ type: 'aligned', direction: '回程', originDate: r.return_date, data: r });
                }
            });

            showDayDetail(dayNum, new Date(dateString), matchedRecords, isFlightDay);
        }

            const returnFrom = document.getElementById('record-return-from').value;
            const returnTo = document.getElementById('record-return-to').value;
            const returnDate = document.getElementById('record-return-date').value;
            const returnPrice = document.getElementById('record-return-price').value ? parseInt(document.getElementById('record-return-price').value) : null;

            const hasDepart = departFrom && departTo && departDate;
            const hasReturn = returnFrom && returnTo && returnDate;

            if (!hasDepart && !hasReturn) return showToast("請選擇出發地與目的地，並填寫歷史日期！", "error");

            const sourceType = document.querySelector('input[name="source_type"]:checked').value;
            const promoCategory = sourceType === 'Spot' ? 'none' : document.querySelector('input[name="promo_category"]:checked').value;

            const recordData = {
                source_type: sourceType,
                depart_from: hasDepart ? departFrom : "",
                depart_to: hasDepart ? departTo : "",
                return_from: hasReturn ? returnFrom : "",
                return_to: hasReturn ? returnTo : "",
                promo_category: promoCategory,
                depart_date: hasDepart ? departDate : null,
                return_date: hasReturn ? returnDate : null,
                depart_price: hasDepart ? departPrice : null,
                return_price: hasReturn ? returnPrice : null
            };

            if (editingRecordId) {
                const index = records.findIndex(item => item.id === editingRecordId);
                if (index > -1) {
                    records[index] = { ...records[index], ...recordData };
                    showToast("紀錄修改成功！");
                }
                cancelEditRecord();
            } else {
                records.push({ id: 'r_' + Date.now(), ...recordData });
                showToast("儲存成功！");
                document.getElementById('record-depart-date').value = '';
                document.getElementById('record-depart-price').value = '';
                document.getElementById('record-return-date').value = '';
                document.getElementById('record-return-price').value = '';
            }

            await syncData();
            populateRouteDropdowns();
            updateDashboard();
            renderRecordsTable();
        }

        async function deleteRecord(id) {
            showConfirm("刪除紀錄", "確定要刪除這筆促銷紀錄嗎？", async () => {
                records = records.filter(r => r.id !== id);
                if (editingRecordId === id) cancelEditRecord();
                await syncData();
                populateRouteDropdowns();
                updateDashboard();
                renderRecordsTable();
                showToast("紀錄已刪除。");
            });
        }

        async function confirmClearAllRecords() {

        function updateGroupCycleButtonUI() {

            if (currentGroupMode === 'city') { btnIcon.className = "fa-solid fa-map-location-dot text-gray-700"; btn.title = "當前分組：依目的地城市"; }

        function toggleAllCollapse() {
            if (currentGroupMode === 'none') return showToast("不分組模式下，無可摺疊之分組", "info");

            const searchVal = document.getElementById('record-search')?.value.toLowerCase() || "";
            const filtered = records.filter(r => `${r.depart_from} ${r.depart_to} ${r.return_from} ${r.return_to} ${r.promo_category}`.toLowerCase().includes(searchVal));

            let groupKeys = new Set();
            if (currentGroupMode === 'city') {
                filtered.forEach(r => {
                    const dest = getDestinationFromRoute(r.depart_to || r.depart_from || r.return_from || r.return_to);
                    groupKeys.add(dest ? `${getAirportName(dest)} (${dest})` : "其他");
                });
            } else if (currentGroupMode === 'category') {
                filtered.forEach(r => {
                    if (r.promo_category === 'anniversary') groupKeys.add("九月 週年大促紀錄");
                    else if (r.promo_category === 'easter') groupKeys.add("三月 復活節促銷紀錄");
                    else groupKeys.add("未分類 / 官網自查");
                });
            }

            const keysArr = Array.from(groupKeys);
            if (keysArr.length === 0) return;

            const hasExpanded = keysArr.some(k => collapsedGroups[k] !== true);
            keysArr.forEach(k => collapsedGroups[k] = hasExpanded);

            renderRecordsTable();
            showToast(hasExpanded ? "已一鍵折疊所有分組" : "已一鍵展開所有分組", "info");

        async function handleScheduleSubmit(e) {
            e.preventDefault();
            const route = document.getElementById('sched-route').value.toUpperCase().trim();
            const fromZh = document.getElementById('sched-from-zh').value.trim();
            const toZh = document.getElementById('sched-to-zh').value.trim();
            const checkedDays = Array.from(document.querySelectorAll('input[name="sched_days"]:checked')).map(cb => parseInt(cb.value));

            if (checkedDays.length === 0) return showToast("請至少點選一個營運星期！", "error");

            const parts = route.split('-');
            if (parts.length === 2) {
                if (fromZh) airportZh[parts[0]] = fromZh;
                if (toZh) airportZh[parts[1]] = toZh;
            }

            if (editingRoute) {
                const idx = schedules.findIndex(s => s.route === editingRoute);
                if (idx !== -1) { schedules[idx].route = route; schedules[idx].days = checkedDays; }
                editingRoute = null;
                showToast(`${route} 營運班表已更新！`);
            } else {
                const idx = schedules.findIndex(s => s.route === route);
                if (idx !== -1) schedules[idx].days = checkedDays;
                else schedules.push({ route, days: checkedDays });
                showToast(`${route} 營運班表已設定！`);
            }

            await syncData();
            resetScheduleForm();
            populateRouteDropdowns();
            updateDashboard();
            renderSchedulesList();
        }

        function startEditSchedule(route) {
            editingRoute = route;
            const sched = schedules.find(s => s.route === route);
            if (!sched) return;

            document.getElementById('sched-route').value = sched.route;
            document.getElementById('sched-route').setAttribute('readonly', 'true');
            document.getElementById('sched-route').classList.add('bg-gray-100', 'text-gray-400');

            const parts = route.split('-');
            if (parts.length === 2) {
                document.getElementById('sched-from-zh').value = airportZh[parts[0]] || "";
                document.getElementById('sched-to-zh').value = airportZh[parts[1]] || "";
            }

            document.querySelectorAll('input[name="sched_days"]').forEach(cb => cb.checked = sched.days.includes(parseInt(cb.value)));
            document.getElementById('btn-submit-schedule').innerHTML = '<i class="fa-solid fa-floppy-disk mr-1"></i> 確認修改';
            document.getElementById('btn-cancel-edit-sched').classList.remove('hidden');
            document.getElementById('schedule-form').scrollIntoView({ behavior: 'smooth' });
        }

        function startCreateScheduleForAirport(airportCode) {
            editingRoute = null;
            resetScheduleForm();
            document.getElementById('sched-route').value = `TPE-${airportCode}`;
            document.getElementById('sched-from-zh').value = "台北桃園";
            document.getElementById('sched-to-zh').value = airportZh[airportCode] || "";
            document.querySelectorAll('input[name="sched_days"]').forEach(cb => cb.checked = false);
            document.getElementById('btn-submit-schedule').innerHTML = '<i class="fa-solid fa-plus-circle mr-1"></i> 設定 / 啟用';
            document.getElementById('btn-cancel-edit-sched').classList.remove('hidden');
            document.getElementById('schedule-form').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEditSchedule() {
            editingRoute = null;
            resetScheduleForm();
        }

        function resetScheduleForm() {
            document.getElementById('schedule-form').reset();
            document.getElementById('sched-route').removeAttribute('readonly');
            document.getElementById('sched-route').classList.remove('bg-gray-100', 'text-gray-400');
            document.getElementById('btn-submit-schedule').innerHTML = '<i class="fa-solid fa-plus-circle mr-1"></i> 設定 / 更新';
            document.getElementById('btn-cancel-edit-sched').classList.add('hidden');
        }

                                <div class="text-[10px] text-gray-400 italic">未啟用 (請點擊設定)</div>
                            </div>
                            <button data-create-schedule="${airportCode}" class="bg-white border border-gray-200 hover:bg-gray-100 text-gray-700 font-bold px-3 py-2 rounded-lg text-[10px] flex items-center gap-1 shrink-0 shadow-sm transition"><i class="fa-solid fa-plus-circle"></i> 設定</button>
                        `;
                    }
                    cardsGrid.appendChild(card);
                });
                groupWrapper.appendChild(cardsGrid);
                container.appendChild(groupWrapper);
            }

            const definedAirports = new Set();
            Object.values(regions).forEach(r => r.airports.forEach(a => definedAirports.add(a)));
            const otherSchedules = schedules.filter(s => !definedAirports.has(getDestinationFromRoute(s.route)));

            if (otherSchedules.length > 0) {
                const groupWrapper = document.createElement('div');
                groupWrapper.className = "space-y-3";
                groupWrapper.innerHTML = `<div class="text-xs font-bold text-gray-700 bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl flex items-center gap-2"><i class="fa-solid fa-globe text-gray-400"></i> <span>其他自訂地區</span></div>`;
                const cardsGrid = document.createElement('div');
                cardsGrid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4";

                otherSchedules.forEach(s => {
                    const card = document.createElement('div');
                    card.className = "bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between shadow-sm text-xs minimal-shadow";
                    let daysHtml = "";
                    [1, 2, 3, 4, 5, 6, 0].forEach(dayIndex => {
                        const isActive = s.days.includes(dayIndex);
                        daysHtml += `<span class="w-[22px] h-[22px] inline-flex items-center justify-center text-[9px] font-bold rounded-md ${isActive ? 'bg-gray-800 text-white shadow-sm' : 'bg-gray-100 text-gray-400'}">${weekDaysChinese[dayIndex]}</span>`;
                    });
                    card.innerHTML = `
                        <div class="space-y-2.5 flex-grow pr-2">
                            <div class="font-bold text-gray-800 flex items-center gap-1.5 flex-wrap"><i class="fa-solid fa-plane text-gray-400 text-[10px]"></i> <span>${getRouteDisplayName(s.route)} (${s.route})</span></div>
                            <div class="flex gap-1.5">${daysHtml}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0 bg-gray-50 rounded-lg p-0.5 border border-gray-100">
                            <button data-edit-schedule="${s.route}" class="text-gray-500 hover:text-gray-800 p-2 rounded-md transition"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button data-delete-schedule="${s.route}" class="text-gray-500 hover:text-rose-500 p-2 rounded-md transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    cardsGrid.appendChild(card);
                });
                groupWrapper.appendChild(cardsGrid);
                container.appendChild(groupWrapper);
            }
        }
    </script>
</body>
</html>
